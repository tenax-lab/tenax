[build-system]
requires = ["hatchling", "hatch-cython>=0.5", "cython>=3.0", "numpy>=1.26", "scipy>=1.11"]
build-backend = "hatchling.build"

[project]
name = "tenax-tn"
version = "0.5.0"
description = "JAX-based tensor network library with symmetry-aware block-sparse tensors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenax Contributors" }]
keywords = ["tensor network", "JAX", "DMRG", "TRG", "iPEPS", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.30",
    "opt-einsum>=3.3.0",
    "numpy>=1.26",
    "networkx>=3.0",
    "optax>=0.2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.4.30; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]>=0.4.30; sys_platform == 'linux'"]
cuda12-local = ["jax[cuda12-local]>=0.4.30; sys_platform == 'linux'"]
cuda13-local = ["jax[cuda13-local]>=0.4.30; sys_platform == 'linux'"]
tpu = ["jax[tpu]>=0.4.30; sys_platform == 'linux'"]
metal = ["jax-metal>=0.1.1; sys_platform == 'darwin'"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "twine>=5.0",
    "cython>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "furo>=2024.0",
    "myst-parser>=3.0",
    "sphinx-design>=0.6",
]

[project.urls]
Homepage = "https://github.com/tenax-lab/tenax"
Repository = "https://github.com/tenax-lab/tenax"
Issues = "https://github.com/tenax-lab/tenax/issues"

[dependency-groups]
dev = ["tenax-tn[dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/tenax"]

[tool.hatch.build.targets.wheel.hooks.cython]
# Required by scipy cython_blas for zdotc/cdotc/zdotu/cdotu return values.
# Without this, complex dot products use wrong calling convention on some BLAS.
define_macros = [["CYTHON_CCOMPLEX", "0"]]

[tool.hatch.build.targets.wheel.hooks.cython.options]
# Package directory name differs from project name (tenax vs tenax-tn)
src = "tenax"
# Only compile .pyx files, not .py files
compile_py = false
# Add numpy include path for numpy/arrayobject.h
include_numpy = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=tenax --cov-report=term-missing --cov-report=xml"
markers = [
    "core: fast API and infrastructure tests",
    "algorithm: full algorithm runs (DMRG, TRG, HOTRG, iPEPS)",
    "slow: expensive tests (excitations, large convergence)",
]
filterwarnings = [
    # optax 0.2.8 still imports `optax.contrib._complex_valued`, which on
    # import calls ``jax.config.update('jax_pmap_shmap_merge', False)`` —
    # deprecated in JAX v0.9.0.  Already removed on optax ``main``; remove
    # this filter once a post-0.2.8 optax release lands.
    "ignore:Setting `jax_pmap_shmap_merge` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/tenax/__init__.py" = ["E402"]
"examples/**" = ["E402"]
"tests/**" = ["F401", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*"]
skip = ["pp*", "*-win*", "*-musllinux*", "*i686*", "*-manylinux_aarch64*"]
test-command = "python -c \"from tenax.contraction._cython_blas import execute_block_plan; print('OK')\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
