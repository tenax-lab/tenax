[build-system]
# Upper bounds guard the build against breaking releases of unpinned build
# tooling (build-system.requires is not captured by uv.lock, so `uv build`
# otherwise resolves the latest at build time). Caps are at the next major,
# except:
#   * hatchling <1.30 -- 1.30.0 (2026-06-01, since yanked) emitted
#     Metadata-Version 2.5, which `twine check` (the Build distribution CI
#     step) rejects as "not a valid metadata version"; lift once
#     twine/packaging support 2.5.
#   * hatch-vcs / hatch-cython are pre-1.0, so their cap is the next major (1.0).
requires = [
    "hatchling>=1.27,<1.30",
    "hatch-vcs>=0.4,<1.0",
    "hatch-cython>=0.5,<1.0",
    "cython>=3.0,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
]
build-backend = "hatchling.build"

[project]
name = "tenax-tn"
dynamic = ["version"]
description = "JAX-based tensor network library with symmetry-aware block-sparse tensors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenax Contributors" }]
keywords = ["tensor network", "JAX", "DMRG", "TRG", "iPEPS", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.30",
    "opt-einsum>=3.3.0",
    "numpy>=1.26",
    "networkx>=3.0",
    "optax>=0.2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.4.30; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]>=0.4.30; sys_platform == 'linux'"]
cuda12-local = ["jax[cuda12-local]>=0.4.30; sys_platform == 'linux'"]
cuda13-local = ["jax[cuda13-local]>=0.4.30; sys_platform == 'linux'"]
tpu = ["jax[tpu]>=0.4.30; sys_platform == 'linux'"]
metal = ["jax-metal>=0.1.1; sys_platform == 'darwin'"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "twine>=5.0",
    "cython>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "furo>=2024.0",
    "myst-parser>=3.0",
    "sphinx-design>=0.6",
]

[project.urls]
Homepage = "https://github.com/tenax-lab/tenax"
Repository = "https://github.com/tenax-lab/tenax"
Issues = "https://github.com/tenax-lab/tenax/issues"

[dependency-groups]
dev = ["tenax-tn[dev]"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tenax/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tenax"]

[tool.hatch.build.targets.wheel.hooks.cython]
# Required by scipy cython_blas for zdotc/cdotc/zdotu/cdotu return values.
# Without this, complex dot products use wrong calling convention on some BLAS.
define_macros = [["CYTHON_CCOMPLEX", "0"]]

[tool.hatch.build.targets.wheel.hooks.cython.options]
# Package directory name differs from project name (tenax vs tenax-tn)
src = "tenax"
# Only compile .pyx files, not .py files
compile_py = false
# Add numpy include path for numpy/arrayobject.h
include_numpy = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=tenax --cov-report=term-missing --cov-report=xml"
markers = [
    "core: fast API and infrastructure tests",
    "algorithm: full algorithm runs (DMRG, TRG, HOTRG, iPEPS)",
    "slow: expensive tests (excitations, large convergence)",
]
filterwarnings = [
    # optax 0.2.8 still imports `optax.contrib._complex_valued`, which on
    # import calls ``jax.config.update('jax_pmap_shmap_merge', False)`` —
    # deprecated in JAX v0.9.0.  Already removed on optax ``main``; remove
    # this filter once a post-0.2.8 optax release lands.
    "ignore:Setting `jax_pmap_shmap_merge` is deprecated:DeprecationWarning",
    # The legacy ``gs_conv_criterion='dE'`` default is deprecated (issue #448)
    # and will be flipped to ``'grad_norm'`` in a future release.  Until the
    # flip lands, every iPEPSConfig() default-construction in the test suite
    # would emit this warning; suppress it here so the noise doesn't drown out
    # genuine warnings.  The dedicated regression test (tests/test_ipeps_ad_conv_criterion.py
    # ::test_iPEPSConfig_dE_emits_deprecation_warning) un-suppresses it via
    # ``pytest.warns`` to verify it still fires.
    "ignore:gs_conv_criterion='dE' is deprecated:DeprecationWarning",
    # Phase-1 deprecation (issue #512): ``chi_ramp`` and the end-of-outer-step
    # ``chi_auto_bump`` are deprecated in favor of the in-CTM
    # ``ctmrg_heuristic_increase_chi`` bump (PR #514).  Suppress the noise in
    # the test bucket — the dedicated regression tests in
    # ``tests/test_chi_ramp_chi_auto_bump_deprecation.py`` un-suppress via
    # ``pytest.warns`` to verify both still fire.
    "ignore:chi_ramp is deprecated:DeprecationWarning",
    "ignore:chi_auto_bump .* is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/tenax/__init__.py" = ["E402"]
"examples/**" = ["E402"]
"tests/**" = ["F401", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*"]
skip = ["pp*", "*-win*", "*-musllinux*", "*i686*", "*-manylinux_aarch64*"]
test-command = "python -c \"from tenax.contraction._cython_blas import execute_block_plan; print('OK')\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
