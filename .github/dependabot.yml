version: 2
updates:
  # One weekly PR that bumps uv.lock.  The PR's CI then tests exactly the
  # versions it would pin.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns: ["*"]
    ignore:
      # cython is also a [build-system] requirement.  When a new cython is
      # released, Dependabot's uv updater tries to bump that entry, finds no
      # file to change (the range already admits it and build requirements
      # are not in uv.lock), raises "No files have changed!", and the error
      # aborts the whole all-dependencies group: no PR at all that week
      # (2026-11-09, cython 3.3.1).  Bump it by hand:
      # `uv lock --upgrade-package cython`.
      - dependency-name: "cython"
      # cuSOLVER decides whether GPU SVDs are correct: 12.2.6.9 returned NaN
      # on ill-conditioned matrices (#691), and PR CI is CPU-only, so it
      # cannot catch that.  Allow a version only after it passes on an A100:
      # the GPU SVD suites plus the ill-conditioned NaN probe.  12.4.1.2
      # passed on 2026-11-11 (0 NaN on 90 matrices, bit-identical to 12.3.5.3;
      # the same probe finds 33 NaN on 12.2.6.9), so the ceiling is 12.4.1.2.
      # Raise it the same way.
      - dependency-name: "nvidia-cusolver"
        versions: [">12.4.1.2"]
      # The CUDA 12 build (11.x versions) has not been re-tested.
      - dependency-name: "nvidia-cusolver-cu12"
