name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run core tests
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run pytest tests/ -m "core" \
            --cov=tenax \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|tests/|pyproject\.toml)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test-full:
    name: Full tests (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.bucket }})
    needs: [changes]
    if: |
      always() &&
      ((github.event_name == 'push' && needs.changes.outputs.code == 'true') ||
       contains(github.event.pull_request.labels.*.name, 'run-full-tests'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        bucket: ["fast", "slow"]
        include:
          - os: macos-latest
            python-version: "3.12"
            bucket: "fast"
          - os: macos-latest
            python-version: "3.12"
            bucket: "slow"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run non-core tests (${{ matrix.bucket }} bucket)
        # Skip ``-m core`` since the required ``test`` job already covers it.
        # Split into ``fast`` (algorithm/integration without slow) and
        # ``slow`` (everything tagged ``@pytest.mark.slow``) buckets for
        # parallelism, isolation, and per-bucket retry granularity. The
        # earlier single ``-m "not core"`` invocation occasionally died
        # ~45–65 min in on Linux 3.11 — initially read as a fixed 1h
        # GitHub-runner reaper, but the post-#370 verification run
        # 25152061002 ran ubuntu 3.12 slow for 82 min uninterrupted, so
        # those kills were one-off long-running tests / runner OOMs,
        # not a fixed reaper. (see #354 / #370.)
        env:
          JAX_PLATFORMS: cpu
          BUCKET: ${{ matrix.bucket }}
        run: |
          if [ "$BUCKET" = "slow" ]; then
            FILTER='slow'
          else
            FILTER='not core and not slow'
          fi
          uv run pytest tests/ -m "$FILTER" \
            --cov=tenax \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  test-no-cython:
    name: Tests without Cython (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run core tests (fallback path)
        env:
          JAX_PLATFORMS: cpu
          TENAX_DISABLE_CYTHON_BLAS: "1"
        run: |
          uv run pytest tests/ -m "core" -v

  test-macos:
    name: Tests (macOS, Python 3.12)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run core tests
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run pytest tests/ -m "core" \
            --cov=tenax \
            --cov-report=term-missing \
            -v

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra docs --dev

      - name: Build docs (warnings as errors)
        run: uv run sphinx-build -W -b html docs docs/_build/html

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution artifacts
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
