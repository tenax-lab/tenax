name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  merge_group:
  # Daily full-suite run on main (#740).  The required checks run only
  # ``pytest -m core``; everything else executes on push-to-main or behind the
  # ``run-full-tests`` label, so a non-core regression could sit red for weeks
  # with nothing reporting it (#740 found 8 such failures at once).  This gives
  # the non-core buckets a standing daily signal.  GitHub disables scheduled
  # workflows after 60 days of repository inactivity and emails the repo owner
  # when a scheduled run fails.
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch:

# One run per pull request, not one per push.  Without this every push queues a
# complete new matrix and nothing supersedes anything: a single afternoon of
# review iterations on #884 left a dozen full runs queued on obsolete commits,
# which is pure waste on its own and becomes a real blocker whenever Actions
# capacity is short -- the head commit sits behind runs nobody wants.
#
# ``cancel-in-progress`` is deliberately CONDITIONAL, and this is the part that
# matters: cancelling a ``merge_group`` run reports a cancelled required check
# to the merge queue, which fails the merge and drops the PR from the queue.
# Pushes to ``main`` and the daily scheduled run must not be cancelled either --
# they are the standing signal for the non-core buckets (#740).  So only
# ``pull_request`` runs are superseded; everything else serialises within its
# group instead.
#
# Non-PR runs get a UNIQUE group, not a shared one keyed on the ref, and
# ``cancel-in-progress: false`` is not enough to make sharing safe: GitHub keeps
# at most one *pending* run per group and cancels the older pending one whatever
# that flag says -- the flag only protects the run that is already executing.
# Grouping every ``main`` push, scheduled run and manual dispatch under
# ``CI-refs/heads/main`` would therefore drop exactly the non-core signal this
# block claims to protect (#740), whenever two land close together.
# ``github.run_id`` is unique per run, so those events never contend at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run core tests
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run pytest tests/ -m "core" \
            --cov=tenax \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: filter
        run: |
          # Workflow edits under ``.github/workflows/`` are included so
          # CI-config changes (e.g. a new test bucket) are exercised by
          # the matrix on the merge commit instead of waiting for an
          # unrelated code push to validate them.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|tests/|pyproject\.toml|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test-full:
    name: Full tests (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.bucket }})
    needs: [changes]
    if: |
      always() &&
      ((github.event_name == 'push' && needs.changes.outputs.code == 'true') ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       contains(github.event.pull_request.labels.*.name, 'run-full-tests'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        bucket: ["fast-ipeps", "fast-other", "slow"]
        include:
          - os: macos-latest
            python-version: "3.12"
            bucket: "fast-ipeps"
          - os: macos-latest
            python-version: "3.12"
            bucket: "fast-other"
          - os: macos-latest
            python-version: "3.12"
            bucket: "slow"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run non-core tests (${{ matrix.bucket }} bucket)
        # Skip ``-m core`` since the required ``test`` job already covers it.
        # Three buckets give parallelism, isolation, and per-bucket retry
        # granularity:
        #   - ``fast-ipeps`` runs ``tests/test_ipeps.py`` and
        #     ``tests/test_fpeps_ad.py``.  These files alone consumed
        #     ~11+ min of the previous combined ``fast`` bucket (out of
        #     a ~57min total) because every test runs CTM convergence
        #     and many run AD optimization.  Isolating them keeps the
        #     other-bucket runtime under ~25 min on ubuntu.
        #   - ``fast-other`` runs the rest of the non-core, non-slow
        #     suite (DMRG / iDMRG / HOTRG / fermionic CTM / ad_utils /
        #     coarse-grain / etc.).
        #   - ``slow`` runs everything tagged ``@pytest.mark.slow``.
        # The earlier single combined ``fast`` bucket got reaped on
        # Linux ~30–45 min in (see merge run 25197411849, where the
        # runner died at ~01:45 mid-``test_optimize_gs_ad_symmetric_
        # energy_decreases``).  The split addresses #354 / #370.
        env:
          JAX_PLATFORMS: cpu
          BUCKET: ${{ matrix.bucket }}
        run: |
          case "$BUCKET" in
            slow)
              FILES="tests/"
              FILTER='slow'
              ;;
            fast-ipeps)
              FILES="tests/test_ipeps.py tests/test_fpeps_ad.py"
              FILTER='not core and not slow'
              ;;
            fast-other)
              FILES="tests/ --ignore=tests/test_ipeps.py --ignore=tests/test_fpeps_ad.py"
              FILTER='not core and not slow'
              ;;
            *)
              echo "Unknown bucket: $BUCKET" >&2
              exit 1
              ;;
          esac
          uv run pytest $FILES -m "$FILTER" \
            --cov=tenax \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  test-no-cython:
    name: Tests without Cython (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run core tests (fallback path)
        env:
          JAX_PLATFORMS: cpu
          TENAX_DISABLE_CYTHON_BLAS: "1"
        run: |
          uv run pytest tests/ -m "core" -v

  test-macos:
    name: Tests (macOS, Python 3.12)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run core tests
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run pytest tests/ -m "core" \
            --cov=tenax \
            --cov-report=term-missing \
            -v

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra docs --dev

      - name: Build docs (warnings as errors)
        run: uv run sphinx-build -W -b html docs docs/_build/html

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution artifacts
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
